# nginx/default.conf
server {
    listen 80;
    server_name test.apiofpeg.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
     listen 443 ssl;
     server_name test.apiofpeg.com;
     ssl_certificate /etc/letsencrypt/live/test.apiofpeg.com/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/test.apiofpeg.com/privkey.pem;

     location / {
        proxy_http_version 1.1;  # ← 이 줄 추가
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
     }

     # SSE 전용 경로 - /scrd/api/subscribe
     location /scrd/api/subscribe {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection 'keep-alive';
        chunked_transfer_encoding off;
        proxy_buffering off;           # SSE만 버퍼링 비활성화
        proxy_cache off;               # SSE만 캐싱 비활성화
        proxy_read_timeout 3600s;      # SSE만 긴 타임아웃
        proxy_send_timeout 3600s;
    }

    # 일반 API - 성능 최적화 설정
    location /scrd/api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 기본값 사용 (버퍼링 on, 캐싱 가능, 적절한 타임아웃)
    }
}